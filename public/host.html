<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Imposter – host</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app wide">
    <header class="hero" id="hero">
      <div class="hero-eyebrow" id="hero-eyebrow">Imposter</div>
      <h1 id="hero-title">Create a game</h1>
      <p id="hero-sub">Students scan a QR code to join.</p>
    </header>

    <main class="sheet">
      <!-- Før spillet er laget -->
      <section id="screen-create">
        <h2>Ready to play?</h2>
        <p class="lead">You get a QR code. Students scan it to enter the lobby.</p>
        <div class="warn" id="setup-warn" hidden>
          The game is not connected to Supabase yet. Add the project URL and key to <b>public/config.js</b>.
        </div>
        <button class="btn" id="create-btn">Create new game</button>
        <div class="error" id="create-error"></div>
      </section>

      <!-- Spillet er i gang -->
      <section id="screen-game" hidden>
        <div id="qr-block" hidden>
          <div class="qr-card">
            <div class="qr" id="qr-img" role="img" aria-label="QR code to join the game"></div>
            <div class="code" id="qr-code"></div>
            <div class="url" id="qr-url"></div>
          </div>
        </div>

        <div id="result-banner" hidden>
          <div class="status" id="banner-status">
            <div class="avatar big" id="banner-avatar"></div>
            <h2 id="banner-title"></h2>
            <p id="banner-text"></p>
          </div>
        </div>

        <div id="vote-progress" hidden>
          <div class="section-title">Vote <span id="vote-progress-text"></span></div>
          <div class="progress"><div id="vote-progress-bar"></div></div>
        </div>

        <div class="section-title"><span id="list-title" style="font-size:18px;font-weight:600;color:inherit"></span><span id="list-count"></span></div>
        <ul class="list" id="players"></ul>

        <button class="btn" id="start-btn" hidden>Start game</button>
        <button class="btn" id="vote-btn" hidden></button>
        <button class="btn secondary" id="close-btn" hidden>Close vote now</button>
        <div class="hint" id="action-hint"></div>
        <button class="link-btn" id="end-btn" hidden>End game</button>
        <button class="btn" id="new-btn" hidden>Create new game</button>
      </section>
    </main>
  </div>
  <div class="toast" id="toast" hidden></div>

  <script src="/config.js"></script>
  <script src="/vendor/supabase.js"></script>
  <script src="/vendor/qrcode.js"></script>
  <script src="/api.js"></script>
  <script src="/host.js"></script>
</body>
</html>
