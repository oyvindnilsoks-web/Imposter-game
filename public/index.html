<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Imposter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <header class="hero" id="hero">
      <div class="hero-eyebrow" id="hero-eyebrow">Imposter</div>
      <h1 id="hero-title">Join the game</h1>
      <p id="hero-sub">Enter your name to play.</p>
    </header>

    <main class="sheet">
      <!-- Bli med -->
      <section id="screen-join">
        <h2>Hi!</h2>
        <p class="lead">Scan the QR code from your teacher, or type the game code.</p>
        <form id="join-form" autocomplete="off">
          <label for="code">Game code</label>
          <input id="code" class="code" maxlength="4" placeholder="ABCD" autocapitalize="characters" spellcheck="false">
          <label for="name">Your name</label>
          <input id="name" maxlength="20" placeholder="For example, Emma" autocomplete="given-name">
          <button class="btn" type="submit" id="join-btn">Join</button>
        </form>
        <div class="error" id="join-error"></div>
      </section>

      <!-- Venter (lobby, mellom runder, etter avgitt stemme) -->
      <section id="screen-wait" hidden>
        <div class="status">
          <div class="avatar big" id="wait-avatar"></div>
          <h2 id="wait-title"></h2>
          <p id="wait-text"></p>
        </div>
        <div class="progress" id="wait-progress" hidden><div id="wait-progress-bar"></div></div>
        <div id="wait-list-wrap" hidden>
          <div class="section-title">Players <span id="wait-count"></span></div>
          <ul class="list" id="wait-list"></ul>
        </div>
      </section>

      <!-- Avstemming -->
      <section id="screen-vote" hidden>
        <h2>Who is the impostor?</h2>
        <p class="lead">You only have one vote, so choose carefully.</p>
        <ul class="list" id="vote-list"></ul>
        <button class="btn" id="vote-btn" disabled>Vote</button>
      </section>

      <!-- Resultat -->
      <section id="screen-result" hidden>
        <div class="status" id="result-status">
          <div class="avatar big" id="result-avatar"></div>
          <h2 id="result-title"></h2>
          <p id="result-text"></p>
        </div>
        <div class="section-title">Votes <span id="result-round"></span></div>
        <ul class="list" id="result-list"></ul>
      </section>
    </main>
  </div>
  <div class="toast" id="toast" hidden></div>

  <script src="/config.js"></script>
  <script src="/vendor/supabase.js"></script>
  <script src="/api.js"></script>
  <script src="/player.js"></script>
</body>
</html>
